<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UZ Aero — 01 Splash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D0D0D; --bg-tint: #111318; --surface: #141414; --surface-raised: #1A1A1A;
    --border: #252525; --border-strong: #333333; --hairline: rgba(255,255,255,0.04);
    --text-primary: #E8E8E8; --text-secondary: #888888; --text-muted: #444444;
    --green: #2ECC71; --green-muted: rgba(46,204,113,0.12); --green-border: rgba(46,204,113,0.28); --green-glow: rgba(46,204,113,0.4);
    --amber: #F39C12; --red: #E74C3C;
    --font-display: 'Bebas Neue', sans-serif; --font-body: 'Archivo', system-ui, sans-serif; --font-mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    --phone-scale: min(1, calc((100vh - 240px) / 852px), calc((100vw - 60px) / 393px));
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(46,204,113,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 20% 100%, rgba(52,152,219,0.03) 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-tint) 0%, var(--bg) 30%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px 80px;
    gap: 28px;
  }

  .canvas-label {
    width: 100%; max-width: 460px;
    display: grid; grid-template-columns: auto 1fr auto;
    align-items: baseline; gap: 20px;
    padding-bottom: 18px; border-bottom: 1px solid var(--border);
  }
  .film-strip { font-family: var(--font-display); font-size: 34px; letter-spacing: 3px; line-height: 1; }
  .slug { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; border-left: 1px solid var(--border); padding-left: 18px; }
  .canvas-meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); letter-spacing: 1px; display: inline-flex; align-items: center; gap: 10px; }
  .canvas-meta .pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px var(--green-muted); animation: pulse 1800ms ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 4px var(--green-muted); opacity: 1; } 50% { box-shadow: 0 0 0 8px transparent; opacity: 0.6; } }

  .phone {
    width: 393px; height: 852px; border-radius: 54px;
    background: var(--bg);
    border: 10px solid #0D0E12;
    box-shadow: 0 0 0 1px #1C1E24, 0 40px 120px rgba(0,0,0,0.7), 0 24px 48px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.03);
    overflow: hidden; position: relative; isolation: isolate; flex-shrink: 0;
    transform: scale(var(--phone-scale)); transform-origin: top center;
    margin-bottom: calc((var(--phone-scale) - 1) * 852px);
  }
  .phone::before { content: ''; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; border-radius: 24px; background: #000; z-index: 100; }
  .phone::after { content: ''; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--text-primary); opacity: 0.28; z-index: 100; }

  .status-bar { display: flex; align-items: center; justify-content: space-between; padding: 18px 36px 0; height: 54px; font-weight: 700; font-size: 15px; color: var(--text-primary); position: relative; z-index: 90; }
  .status-right { display: inline-flex; align-items: center; gap: 6px; }

  /* ===== SPLASH SCREEN ===== */
  .splash {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 48px 32px;
    background: var(--bg);
    background-image: radial-gradient(ellipse 100% 60% at 50% 30%, rgba(46,204,113,0.07) 0%, transparent 70%);
  }

  .app-icon {
    width: 88px; height: 88px; border-radius: 24px;
    background: linear-gradient(135deg, #1A2E1A 0%, #0D1A0D 100%);
    border: 1px solid var(--green-border);
    box-shadow: 0 0 40px rgba(46,204,113,0.2), 0 0 80px rgba(46,204,113,0.08), inset 0 1px 0 rgba(46,204,113,0.1);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 32px;
    animation: iconAppear 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  @keyframes iconAppear {
    from { opacity: 0; transform: scale(0.8) translateY(12px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .app-name {
    font-family: var(--font-display);
    font-size: 56px; letter-spacing: 6px; line-height: 1;
    color: var(--text-primary); text-align: center;
    margin-bottom: 6px;
    animation: textAppear 0.8s 0.15s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  .app-name span { color: var(--green); }
  .app-tagline {
    font-family: var(--font-mono);
    font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--text-muted); text-align: center;
    margin-bottom: 48px;
    animation: textAppear 0.8s 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  @keyframes textAppear {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .splash-footer {
    position: absolute; bottom: 36px; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    animation: textAppear 0.8s 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  .ref-sync {
    font-family: var(--font-mono);
    font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text-secondary);
    display: inline-flex; align-items: center; gap: 7px;
    margin-bottom: 4px;
  }
  .ref-sync .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green-glow); }
  .version-tag {
    font-family: var(--font-mono);
    font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text-muted);
  }
  .version-tag span { color: var(--text-secondary); }
  .start-btn {
    margin-top: 32px;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 10px;
    width: calc(100% - 64px);
    padding: 16px 24px;
    background: var(--green-muted);
    border: 1px solid var(--green-border);
    border-radius: 16px;
    color: var(--green);
    font-family: var(--font-display);
    font-size: 20px; letter-spacing: 3px;
    text-decoration: none;
    transition: all 0.2s ease;
    box-shadow: 0 0 20px rgba(46,204,113,0.1);
    animation: textAppear 0.8s 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  .start-btn:hover {
    background: var(--green);
    color: #0D0D0D;
    box-shadow: 0 0 32px rgba(46,204,113,0.4);
  }

  /* nav strip */
  .nav-strip {
    width: 100%; max-width: 460px;
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
    font-family: var(--font-mono); font-size: 11px;
  }
  .nav-strip a { color: var(--text-muted); text-decoration: none; padding: 4px 8px; border-radius: 5px; transition: color 0.15s; }
  .nav-strip a:hover { color: var(--green); }
  .nav-strip a.active { color: var(--green); }
  .nav-strip span { color: var(--border-strong); }
</style>
</head>
<body>

<header class="canvas-label">
  <span class="film-strip">UZ AERO — 01</span>
  <span class="slug">splash · boot screen</span>
  <span class="canvas-meta"><span class="pulse"></span>Screen 1 / 11</span>
</header>

<main class="phone" role="region" aria-label="Mockup — Splash Screen">
  <div class="status-bar">
    <span>9:41</span>
    <span class="status-right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="0.5"/><rect x="5" y="5" width="3" height="7" rx="0.5"/><rect x="10" y="2" width="3" height="10" rx="0.5"/><rect x="15" y="0" width="3" height="12" rx="0.5" opacity="0.4"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 11.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/><path d="M4 7.5a6 6 0 0 1 8 0l-1 1a4.6 4.6 0 0 0-6 0l-1-1Z"/><path d="M1.5 4.5a10 10 0 0 1 13 0l-1 1a8.5 8.5 0 0 0-11 0l-1-1Z" opacity="0.6"/></svg>
      <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke="currentColor" opacity="0.5"/><rect x="2" y="2" width="19" height="8" rx="1.5" fill="currentColor"/><rect x="23" y="4" width="2" height="4" rx="1" fill="currentColor" opacity="0.5"/></svg>
    </span>
  </div>

  <div class="splash">
    <div class="app-icon">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.8 19.2L16 11l3.5-3.5C21 6 21 4 19.5 2.5S18 2 16.5 3.5L13 7l-8.2-1.8L3 7l7 4-2 3-4-1-2 2 4 2 2 4 2-2-1-4 3-2 4 7 2-1.2Z"/>
      </svg>
    </div>

    <div class="app-name">UZ <span>AERO</span></div>
    <div class="app-tagline">Elektroniczny system lotniczy</div>

    <a href="02-preflight.html" class="start-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      NOWY DZIEŃ LOTNY
    </a>

    <div class="splash-footer">
      <div class="ref-sync" title="Cache referencyjny (samoloty, konfiguracje, piloci) odświeżany przy każdym starcie z siecią; offline — data ostatniego synca"><span class="dot"></span>Dane referencyjne · sync 09:41</div>
      <div class="version-tag">React Native · Expo · <span>v1.0.0-alpha</span></div>
      <div class="version-tag" style="opacity:0.5">Offline-first · GPS · Auto-sync</div>
    </div>
  </div>
</main>

</nav>

</body>
</html>
